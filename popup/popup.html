<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Will I Finish It?</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="popup.css" />
</head>
<body>

<div class="header">
    <p class="header-eyebrow">Reading Tracker</p>
    <h1>Will I <span>Finish</span> It?</h1>
</div>

<div id="content">Loading…</div>

<div class="section-divider"><span>Add a book</span></div>

<form id="manual-form">
    <div class="input-group">
        <input id="m-title"  placeholder="Book title"  required />
    </div>
    <div class="input-group">
        <input id="m-author" placeholder="Author"      required />
    </div>
    <div class="input-group">
        <input id="m-genre"  placeholder="Genre"       required />
    </div>
    <div class="input-group">
        <input list="choices" id="m-status"  placeholder="Status"       required />
        <datalist id="choices">
            <option value="Abandoned"></option>
            <option value="Finished"></option>
        </datalist>
    </div>
    <div class="input-row">
        <div class="input-group">
            <input id="m-rating" placeholder="Rating (1–5)" required type="number" min="1" max="5" />
        </div>
        <div class="input-group">
            <input id="m-pages"  placeholder="Pages"     required type="number" min="1" />
        </div>
    </div>
    <button id="m-submit" type="button">Add book</button>
</form>

<script src="popup.js"></script>
</body>
</html>
